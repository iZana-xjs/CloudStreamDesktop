name: Gradle dependency submission

on:
  push:
    branches: [main]
    paths:
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/gradle.lockfile"
      - "gradlew"
      - "gradle/**"
      - ".github/workflows/dependency-submission.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gradle-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate and submit the resolved Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          dependency-graph: generate-and-submit
