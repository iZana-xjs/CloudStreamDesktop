name: Gradle dependency submission

on:
  push:
    branches: [main]
    paths:
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/gradle.lockfile"
      - "gradlew"
      - "gradle/**"
      - ".github/workflows/dependency-submission.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gradle-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate and submit the resolved Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          dependency-graph: generate-and-submit
